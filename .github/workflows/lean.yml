name: Trusted Lean sample
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.11.0'
      - run: npm ci --ignore-scripts
      - uses: leanprover/lean-action@a2cd0b8fd34c304895595abb5f1cfb892e2b50d8
        with:
          lake-package-directory: examples/lean-contracts
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
      - run: npm run lean:check
      - name: Check the public coding-agent reuse example
        working-directory: examples/lean-contracts
        run: lean -DwarningAsError=true ../../evidence/external-codex-public.lean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lean-check-${{ github.sha }}
          path: evidence/lean-check.json
