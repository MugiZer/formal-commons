name: Propose a verified component
description: Identify an implementation and the argument connecting it to a property.
title: "[component] "
body:
  - type: markdown
    attributes:
      value: "This is a proposal, not automatic approval. Unknown evidence stays unknown. Please submit only public material you are entitled to share."
  - type: input
    id: title
    attributes:
      label: Artifact or project title
      placeholder: A specific behavior or upstream project
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavior, exact statement, and intended reuse
      description: Include the formal symbol and statement for an artifact. Explain the boundary cases covered.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Canonical source and immutable revision
      description: GitHub repository URL, 40-character commit SHA, exact file/symbol, proof system and version, and upstream source owners.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Assumptions and limitations
      description: What is assumed, omitted, or unconnected to an implementation? Project proposals should include contribution opportunities and upstream issues.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Available evidence
      description: Link actual check logs, checker versions, identified semantic reviews and implementation correspondence. Say unknown where unavailable; passing CI is not expert review.
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: License and attribution
      description: State the license and link the pinned license file or per-file notices. Identify the authors/source owners.
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public contribution
      options:
        - label: I am entitled to share this material publicly and have removed confidential details.
          required: true
